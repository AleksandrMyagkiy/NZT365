name: Apply NZT v12 integration

on:
  workflow_dispatch:
  push:
    branches: [ nzt-v12 ]
    paths:
      - 'tools/activate_v12.py'
      - '.github/workflows/apply_v11_reader.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nzt-v12
      - name: Activate v12 workout
        run: python tools/activate_v12.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nzt365/app/V7Product.kt app/src/main/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m "Activate NZT v12 workout experience"
            git push
          fi
