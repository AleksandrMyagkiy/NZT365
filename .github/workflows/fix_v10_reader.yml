name: Fix NZT v10 reader

on:
  workflow_dispatch:
  push:
    branches: [ nzt-v10-reader-reset-brand ]
    paths:
      - 'tools/fix_v10_reader.py'
      - '.github/workflows/fix_v10_reader.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nzt-v10-reader-reset-brand
      - name: Apply compile fix
        run: python tools/fix_v10_reader.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nzt365/app/V10Reader.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix NZT Reader v10 compilation"
            git push
          fi
