name: Build NZT365 Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.NZT_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/nzt365-release.jks"

      - name: Build release APK
        env:
          NZT_KEYSTORE_FILE: ${{ runner.temp }}/nzt365-release.jks
          NZT_KEYSTORE_PASSWORD: ${{ secrets.NZT_KEYSTORE_PASSWORD }}
          NZT_KEY_ALIAS: ${{ secrets.NZT_KEY_ALIAS }}
          NZT_KEY_PASSWORD: ${{ secrets.NZT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NZT365-release-apk
          path: app/build/outputs/apk/release/app-release.apk
