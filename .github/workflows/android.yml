name: Build NZT365 Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, nzt-v3-final-pass ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Apply staged v3 source
        if: ${{ hashFiles('.v3patch/chunk_00') != '' }}
        shell: bash
        run: |
          cat .v3patch/chunk_* | base64 --decode > "$RUNNER_TEMP/nzt-v3.zip"
          unzip -o "$RUNNER_TEMP/nzt-v3.zip" -d "$GITHUB_WORKSPACE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        shell: bash
        run: |
          echo "${{ secrets.NZT_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/nzt365-release.jks"

      - name: Build release APK
        env:
          NZT_KEYSTORE_FILE: ${{ runner.temp }}/nzt365-release.jks
          NZT_KEYSTORE_PASSWORD: ${{ secrets.NZT_KEYSTORE_PASSWORD }}
          NZT_KEY_ALIAS: ${{ secrets.NZT_KEY_ALIAS }}
          NZT_KEY_PASSWORD: ${{ secrets.NZT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NZT365-v3.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NZT365-v3.0.0
          path: NZT365-v3.0.0.apk
